name: test

on:
    push:
        branches:
            - master

    pull_request:
        branches:
            - master

    workflow_dispatch:

    schedule:
        # 6:00 A.M UTC  == 9:00 AM EAT
        - cron: "0 6 * * *"

jobs:
    offline:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Install Qt runtime libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |

                  python -m pip install --upgrade pip
                  pip install -r dev-requirements.txt
                  poetry install

            - name: Offline tests
              run: poetry run poe test_offline

            - name: Lint
              run: poetry run ruff check .

    live-smoke:
        needs: offline
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            SENPWAI_BROWSER_INTERACTION_TIMEOUT: 15

        steps:
            - name: Install Qt runtime libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |

                  python -m pip install --upgrade pip
                  pip install -r dev-requirements.txt
                  poetry install

            - name: Install browser runtime
              run: |
                  sudo apt-get install --no-install-recommends -y xvfb
                  poetry run playwright install chromium

            - name: Pahe live provider smoke
              id: test_pahe
              run: xvfb-run -a poetry run poe test_pahe_dpl

            - name: Record live smoke outcome
              if: ${{ always() }}
              run: |
                  echo "Pahe live smoke outcome: ${{ steps.test_pahe.outcome }}"
